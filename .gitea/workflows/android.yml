name: Android validation

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /tmp/immichframe-android-sdk
      ANDROID_SDK_ROOT: /tmp/immichframe-android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        run: JDK_DIR="$JAVA_HOME" scripts/setup-dev.sh
      - name: Validate Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          bash gradlew --no-daemon --version
      - name: Validate
        run: >-
          bash gradlew --no-daemon --max-workers=1
          -Dorg.gradle.jvmargs="-Xmx1024m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-validation
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/debug/app-debug.apk
